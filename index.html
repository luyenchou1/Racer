<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monaco GT">
  <meta name="theme-color" content="#101020">
  <meta name="description" content="Monaco GT - a 16-bit style arcade racer for your phone.">
  <title>Monaco GT</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="crt" class="on"></div>

    <!-- Touch controls: DOM overlay so safe-area insets and multi-touch are handled by the browser -->
    <div id="controls" class="hidden">
      <div id="steer-zone" class="zone">
        <div id="steer-track">
          <div id="steer-knob"></div>
        </div>
        <div class="zone-label">STEER</div>
      </div>
      <div id="pedal-zone" class="zone">
        <div id="btn-turbo" class="pedal turbo"><span>TURBO</span></div>
        <div id="btn-brake" class="pedal brake"><span>BRAKE</span></div>
        <div id="btn-gas" class="pedal gas"><span>GAS</span></div>
      </div>
    </div>

    <div id="top-buttons">
      <button id="btn-pause" class="icon-btn hidden" aria-label="Pause">II</button>
      <button id="btn-mute" class="icon-btn" aria-label="Mute">&#9835;</button>
    </div>
  </div>

  <script src="js/palette.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/tracks/monaco.js"></script>
  <script src="js/track.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
